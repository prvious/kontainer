name: kontainer-server

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: kontainer_development
      POSTGRES_PASSWORD: kontainer
      POSTGRES_USER: kontainer
    ports:
      - "127.0.0.1:${KONTAINER_POSTGRES_PORT:-55466}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kontainer -d kontainer_development"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - kontainer_postgres_data:/var/lib/postgresql/data

volumes:
  kontainer_postgres_data:

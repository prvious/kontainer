logger:
  enable: false
  pretty_backtrace: true
  level: debug
  format: compact

server:
  binding: 127.0.0.1
  port: 5151
  host: http://127.0.0.1:5151
  middlewares: {}

database:
  uri: <%= get_env(name="DATABASE_URL", default="postgres://kontainer:kontainer@127.0.0.1:5432/kontainer_test") %>
  enable_logging: false
  connect_timeout: 500
  idle_timeout: 500
  min_connections: 1
  max_connections: 2
  auto_migrate: true
  dangerously_truncate: true
  dangerously_recreate: true

settings:
  agent_rpc:
    enabled: false
    binding: 127.0.0.1:50052
    tls:
      certificate_path: config/test-controller.pem
      private_key_path: config/test-controller-key.pem
      client_ca_path: config/test-agent-ca.pem

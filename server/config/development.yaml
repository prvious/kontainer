logger:
  enable: true
  pretty_backtrace: true
  level: <%= get_env(name="LOG_LEVEL", default="debug") %>
  format: compact

server:
  binding: <%= get_env(name="BINDING", default="127.0.0.1") %>
  port: <%= get_env(name="PORT", default="5150") %>
  host: <%= get_env(name="HOST", default="http://127.0.0.1:5150") %>
  middlewares:
    catch_panic:
      enable: true
    # Framework URI logging stays off: it records full query strings and
    # would persist OAuth `code`/`state`. Path-only tracing is layered in
    # server::supervise_controller_servers instead.
    logger:
      enable: false
    request_id:
      enable: true

database:
  uri: <%= get_env(name="DATABASE_URL", default="postgres://kontainer:kontainer@127.0.0.1:55466/kontainer_development") %>
  enable_logging: <%= get_env(name="DB_LOGGING", default="false") %>
  connect_timeout: 500
  idle_timeout: 500
  min_connections: 1
  max_connections: 5
  auto_migrate: true
  dangerously_truncate: false
  dangerously_recreate: false

settings:
  shutdown_grace: "<%= get_env(name="SHUTDOWN_GRACE", default="20s") %>"
  # Development dials the dev cluster (dev/docker-compose.yml) with the
  # certificates dev/pki.sh writes; run `pnpm dev:pki` before starting.
  agent_rpc:
    enabled: <%= get_env(name="AGENT_RPC_ENABLED", default="true") %>
    binding: <%= get_env(name="AGENT_RPC_BINDING", default="127.0.0.1:50051") %>
    cluster_id: <%= get_env(name="CLUSTER_ID", default="development") %>
    tls:
      certificate_path: <%= get_env(name="AGENT_RPC_TLS_CERTIFICATE_PATH", default="../dev/pki/controller.pem") %>
      private_key_path: <%= get_env(name="AGENT_RPC_TLS_PRIVATE_KEY_PATH", default="../dev/pki/controller-key.pem") %>
      client_ca_path: <%= get_env(name="AGENT_RPC_TLS_CLIENT_CA_PATH", default="../dev/pki/agent-ca.pem") %>
    client:
      endpoint: <%= get_env(name="AGENT_CLIENT_ENDPOINT", default="https://127.0.0.1:50052") %>
      server_name: <%= get_env(name="AGENT_CLIENT_SERVER_NAME", default="manager.agent.kontainer.internal") %>
      node_id: <%= get_env(name="AGENT_CLIENT_NODE_ID", default="manager") %>
  # tcp:// is accepted only in development and test (ADR 0004).
  docker:
    host: <%= get_env(name="KONTAINER_DOCKER_HOST", default="unix:///var/run/docker.sock") %>
  public_http:
    mode: plaintext
  # GitHub bootstrap login ships disabled. Enabling it requires a client
  # ID, a secret file, and at least one numeric account ID; anything less
  # fails startup or login closed.
  github_auth:
    enabled: <%= get_env(name="GITHUB_AUTH_ENABLED", default="false") %>
    client_id: "<%= get_env(name="GITHUB_AUTH_CLIENT_ID", default="") %>"
    client_secret_path: "<%= get_env(name="GITHUB_AUTH_CLIENT_SECRET_PATH", default="") %>"
    allowlisted_account_ids: "<%= get_env(name="GITHUB_AUTH_ALLOWLISTED_ACCOUNT_IDS", default="") %>"

logger:
  enable: true
  pretty_backtrace: false
  level: <%= get_env(name="LOG_LEVEL", default="info") %>
  format: json

server:
  binding: <%= get_env(name="BINDING", default="0.0.0.0") %>
  port: <%= get_env(name="PORT", default="5150") %>
  host: <%= get_env(name="HOST") %>
  middlewares:
    catch_panic:
      enable: true
    # Framework URI logging stays off: it records full query strings and
    # would persist OAuth `code`/`state`. Path-only tracing is layered in
    # server::supervise_controller_servers instead.
    logger:
      enable: false
    request_id:
      enable: true

database:
  uri: <%= get_env(name="DATABASE_URL") %>
  enable_logging: <%= get_env(name="DB_LOGGING", default="false") %>
  connect_timeout: <%= get_env(name="DB_CONNECT_TIMEOUT", default="500") %>
  idle_timeout: <%= get_env(name="DB_IDLE_TIMEOUT", default="500") %>
  min_connections: <%= get_env(name="DB_MIN_CONNECTIONS", default="2") %>
  max_connections: <%= get_env(name="DB_MAX_CONNECTIONS", default="20") %>
  auto_migrate: <%= get_env(name="DB_AUTO_MIGRATE", default="false") %>
  dangerously_truncate: false
  dangerously_recreate: false

settings:
  shutdown_grace: "<%= get_env(name="SHUTDOWN_GRACE", default="20s") %>"
  agent_rpc:
    enabled: true
    binding: <%= get_env(name="AGENT_RPC_BINDING", default="0.0.0.0:50051") %>
    cluster_id: <%= get_env(name="CLUSTER_ID") %>
    tls:
      certificate_path: <%= get_env(name="AGENT_RPC_TLS_CERTIFICATE_PATH") %>
      private_key_path: <%= get_env(name="AGENT_RPC_TLS_PRIVATE_KEY_PATH") %>
      client_ca_path: <%= get_env(name="AGENT_RPC_TLS_CLIENT_CA_PATH") %>
  # Must stay a unix:// socket; tcp:// fails startup outside development/test.
  docker:
    host: <%= get_env(name="KONTAINER_DOCKER_HOST", default="unix:///var/run/docker.sock") %>
  public_http:
    mode: tls
    tls:
      certificate_path: <%= get_env(name="PUBLIC_HTTP_TLS_CERTIFICATE_PATH") %>
      private_key_path: <%= get_env(name="PUBLIC_HTTP_TLS_PRIVATE_KEY_PATH") %>
  # GitHub bootstrap login ships disabled. Enabling it requires a client
  # ID, a secret file, and at least one numeric account ID; anything less
  # fails startup or login closed.
  github_auth:
    enabled: <%= get_env(name="GITHUB_AUTH_ENABLED", default="false") %>
    client_id: "<%= get_env(name="GITHUB_AUTH_CLIENT_ID", default="") %>"
    client_secret_path: "<%= get_env(name="GITHUB_AUTH_CLIENT_SECRET_PATH", default="") %>"
    allowlisted_account_ids: "<%= get_env(name="GITHUB_AUTH_ALLOWLISTED_ACCOUNT_IDS", default="") %>"

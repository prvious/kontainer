[workspace]
members = [
  ".",
  "crates/agent-proto",
  "crates/engine",
  "crates/native-client",
  "crates/node-agent",
  "crates/rpc-auth",
  "crates/stream-protocol",
  "crates/stream-transport",
  "migration",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[workspace.dependencies]
async-trait = "0.1.89"
axum = { version = "0.8.4", features = ["ws"] }
base64 = "0.22.1"
bollard = { version = "0.21.1", default-features = false, features = ["http", "pipe"] }
chrono = { version = "0.4.41", features = ["serde"] }
futures-util = "0.3.31"
hyper = { version = "1.11.0", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "0.1.20", default-features = false, features = ["service", "tokio"] }
loco-rs = { version = "1.1.0", default-features = false, features = [
  "auth",
  "cache_inmem",
  "cli",
  "with-db",
] }
prost = "0.14.1"
prost-build = "0.14.1"
protoc-bin-vendored = "3.2.0"
reqwest = { version = "0.12.23", default-features = false, features = [
  "json",
  "rustls-tls-webpki-roots",
] }
rustls = { version = "0.23.27", default-features = false, features = [
  "ring",
  "std",
  "tls12",
] }
sea-orm = { version = "2.0.2", default-features = false, features = [
  "macros",
  "runtime-tokio-rustls",
  "sqlx-postgres",
] }
sea-orm-migration = { version = "2.0.2", default-features = false, features = [
  "runtime-tokio-rustls",
  "sqlx-postgres",
] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
subtle = "2.6.1"
thiserror = "2.0.17"
tokio = { version = "1.47.1", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tokio-stream = { version = "0.1.19", features = ["net"] }
tokio-util = "0.7.19"
tokio-tungstenite = { version = "0.29.0", default-features = false, features = [
  "connect",
  "rustls-tls-webpki-roots",
] }
tonic = { version = "0.14.6", features = ["tls-ring"] }
tonic-prost = "0.14.6"
tower = { version = "0.5.2", features = ["util"] }
tracing = "0.1.41"
url = "2.5.7"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "json"] }
utoipa = { version = "5.5.0", features = ["axum_extras"] }
uuid = { version = "1.18.1", features = ["serde", "v7"] }
x509-parser = "0.18.1"

[package]
name = "kontainer-controller"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
default-run = "kontainer-controller"

[dependencies]
async-trait.workspace = true
axum.workspace = true
base64.workspace = true
chrono.workspace = true
kontainer-agent-proto = { path = "crates/agent-proto" }
kontainer-rpc-auth = { path = "crates/rpc-auth" }
futures-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
loco-rs.workspace = true
migration = { path = "migration" }
reqwest.workspace = true
rustls.workspace = true
sea-orm.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-rustls = { version = "0.26.5", default-features = false, features = ["ring", "tls12"] }
tokio-stream.workspace = true
tokio-util.workspace = true
tonic.workspace = true
tonic-prost.workspace = true
tower.workspace = true
tracing.workspace = true
url.workspace = true
utoipa.workspace = true
uuid.workspace = true

[dev-dependencies]
kontainer-engine = { path = "crates/engine" }
kontainer-node-agent = { path = "crates/node-agent" }
rcgen = "0.14.9"
tempfile = "3.27.0"
tokio-rustls = { version = "0.26.5", default-features = false, features = ["ring", "tls12"] }
tower.workspace = true
url.workspace = true

[[bin]]
name = "kontainer-controller"
path = "src/bin/main.rs"

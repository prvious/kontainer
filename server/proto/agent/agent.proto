syntax = "proto3";
package agent;
option go_package = "github.com/prvious/kontainer/server/proto/agent";

service AgentService {
    rpc Health(HealthRequest) returns (HealthResponse);
    rpc Info(InfoRequest) returns (InfoResponse);
    rpc Metrics(MetricsRequest) returns (MetricsResponse);
    rpc ListImages(ListImagesRequest) returns (ListImagesResponse);
    rpc RemoveImage(RemoveImageRequest) returns (RemoveImageResponse);
    rpc PruneImages(PruneImagesRequest) returns (PruneImagesResponse);
    rpc Exec(stream ExecMessage) returns (stream ExecMessage);
}

// --- Health ---
message HealthRequest {}
message HealthResponse {
    string status = 1;
    string node_id = 2;
    string hostname = 3;
}

// --- Info ---
message InfoRequest {}
message InfoResponse {
    string node_id = 1;
    string hostname = 2;
    string role = 3;
}

// --- Metrics ---
message MetricsRequest {}
message MetricsResponse {
    string timestamp = 1;
    string node_id = 2;
    string hostname = 3;
    NodeMetrics node = 4;
    repeated ContainerMetrics containers = 5;
}

message NodeMetrics {
    int32 cpus = 1;
    double cpu_percent = 2;
    int64 memory_used = 3;
    int64 memory_total = 4;
    double memory_percent = 5;
    int64 disk_used = 6;
    int64 disk_total = 7;
    double disk_percent = 8;
}

message ContainerMetrics {
    string container_id = 1;
    string name = 2;
    string service_id = 3;
    double cpu_percent = 4;
    int64 memory_usage = 5;
    int64 memory_limit = 6;
    double memory_percent = 7;
}

// --- Images ---
message ListImagesRequest {}
message ListImagesResponse {
    string node_id = 1;
    string hostname = 2;
    repeated ImageItem images = 3;
}

message ImageItem {
    string id = 1;
    repeated string tags = 2;
    int64 size = 3;
    int64 created = 4;
}

message RemoveImageRequest {
    string image_id = 1;
    bool force = 2;
}

message RemoveImageResponse {
    repeated string deleted = 1;
    repeated string untagged = 2;
}

message PruneImagesRequest {}
message PruneImagesResponse {
    uint64 space_reclaimed = 1;
    int32 images_deleted = 2;
}

// --- Exec (bidirectional stream) ---
message ExecMessage {
  enum Type {
    INIT = 0;
    DATA = 1;
    RESIZE = 2;
    EXIT = 3;
    ERROR = 4;
  }
  Type type = 1;
  bytes data = 2;
  uint32 cols = 3;
  uint32 rows = 4;
  int32 exit_code = 5;
  string error = 6;
  string shell = 7;
}

name: Desktop Rust

on:
  push:
    branches:
      - main
    paths:
      - "app/src-tauri/**"
      - "app/src/types/session.ts"
      - "app/tests/fixtures/session-ipc.json"
      - "server/crates/native-client/**"
      - ".github/workflows/desktop-rust.yml"
  pull_request:
    branches:
      - main
    paths:
      - "app/src-tauri/**"
      - "app/src/types/session.ts"
      - "app/tests/fixtures/session-ipc.json"
      - "server/crates/native-client/**"
      - ".github/workflows/desktop-rust.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  MANIFEST: app/src-tauri/Cargo.toml

jobs:
  verify:
    name: Desktop verification (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy

      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            build-essential \
            gnome-keyring \
            dbus-x11

      - name: Cache Cargo build data
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      # `tauri-build` resolves `frontendDist` at build time; the Rust lanes do
      # not build the frontend, so the directory must exist.
      - name: Prepare frontend placeholder
        shell: bash
        run: mkdir -p app/dist

      - name: Check formatting
        run: cargo fmt --manifest-path ${{ env.MANIFEST }} --all -- --check

      - name: Run Clippy
        run: cargo clippy --manifest-path ${{ env.MANIFEST }} --all-targets -- -D warnings

      - name: Run unit tests (no real vault)
        run: cargo test --manifest-path ${{ env.MANIFEST }}

      - name: Guard the vault dependency graph (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          tree="$(cargo tree --manifest-path app/src-tauri/Cargo.toml --prefix none)"
          if echo "$tree" | grep -E '^(keyring v|linux-keyutils-keyring-store|db-keystore)'; then
            echo "Unsupported credential store entered the dependency graph." >&2
            exit 1
          fi
          if cargo tree --manifest-path app/src-tauri/Cargo.toml -e features | grep -qE 'secret-service.*crypto-openssl'; then
            echo "The Linux vault must use Rust cryptography, not OpenSSL." >&2
            exit 1
          fi

      - name: Qualify the native credential store (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          eval "$(dbus-launch --sh-syntax)"
          keyring_env="$(printf 'kontainer-ci' | gnome-keyring-daemon --unlock --components=secrets --daemonize)" \
            || { echo "gnome-keyring-daemon did not start" >&2; exit 1; }
          eval "$keyring_env"
          output="$(cargo test --manifest-path "$MANIFEST" --lib -- --ignored --nocapture real_vault_round_trip 2>&1)"
          echo "$output"
          grep -q 'real_vault_round_trip \.\.\. ok' <<<"$output" \
            || { echo "the real-vault qualification did not run to completion" >&2; exit 1; }

      - name: Qualify the native credential store (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          security unlock-keychain -p "" "$HOME/Library/Keychains/login.keychain-db"
          output="$(cargo test --manifest-path "$MANIFEST" --lib -- --ignored --nocapture real_vault_round_trip 2>&1)"
          echo "$output"
          grep -q 'real_vault_round_trip \.\.\. ok' <<<"$output" \
            || { echo "the real-vault qualification did not run to completion" >&2; exit 1; }

      - name: Qualify the native credential store (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          output="$(cargo test --manifest-path "$MANIFEST" --lib -- --ignored --nocapture real_vault_round_trip 2>&1)"
          echo "$output"
          grep -q 'real_vault_round_trip \.\.\. ok' <<<"$output" \
            || { echo "the real-vault qualification did not run to completion" >&2; exit 1; }

name: Server Rust

on:
  push:
    branches:
      - main
    paths:
      - "server/**"
      - ".github/workflows/server-rust.yml"
  pull_request:
    branches:
      - main
    paths:
      - "server/**"
      - ".github/workflows/server-rust.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Workspace verification
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: kontainer
          POSTGRES_USER: kontainer
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kontainer -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      KONTAINER_REQUIRE_POSTGRES_TESTS: "1"
      KONTAINER_TEST_DATABASE_URL: postgres://kontainer:kontainer@127.0.0.1:5432/postgres
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy

      - name: Cache Cargo build data
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: server

      - name: Check formatting
        run: cargo fmt --manifest-path server/Cargo.toml --all -- --check

      - name: Check workspace
        run: cargo check --manifest-path server/Cargo.toml --workspace --all-targets

      - name: Guard single crypto provider
        run: |
          if cargo tree --manifest-path server/Cargo.toml --workspace -e features | grep -E "aws-lc-rs|aws-lc-sys"; then
            echo "aws-lc packages must stay out of the tree: ring is the only rustls crypto engine" >&2
            exit 1
          fi

      - name: Run Clippy
        run: cargo clippy --manifest-path server/Cargo.toml --workspace --all-targets -- -D warnings

      - name: Run workspace tests
        run: cargo test --manifest-path server/Cargo.toml --workspace

      - name: Build controller independently
        run: cargo build --manifest-path server/Cargo.toml --package kontainer-controller --bin kontainer-controller

      - name: Build node agent independently
        run: cargo build --manifest-path server/Cargo.toml --package kontainer-node-agent --bin kontainer-node-agent

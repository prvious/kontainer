name: Docker

on:
  pull_request:
    branches:
      - main
    paths:
      - "server/crates/engine/**"
      - "server/Cargo.toml"
      - "server/Cargo.lock"
      - ".github/workflows/docker.yml"
  push:
    branches:
      - main
    paths:
      - "server/crates/engine/**"
      - "server/Cargo.toml"
      - "server/Cargo.lock"
      - ".github/workflows/docker.yml"
  workflow_dispatch:
    inputs:
      backend:
        description: Docker backend (fake checks only the API contract)
        type: choice
        default: real
        options: [real, fake]

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  real-engine:
    if: github.event_name != 'workflow_dispatch' || inputs.backend == 'real'
    name: Docker ${{ matrix.engine.version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        engine:
          - version: 27.5.1
            image: docker:27.5.1-dind
            negotiated_api: "1.47"
          - version: 29.7.2
            image: docker:29.7.2-dind
            negotiated_api: "1.53"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
          shared-key: docker
          cache-workspace-crates: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Start Docker
        env:
          ENGINE_IMAGE: ${{ matrix.engine.image }}
          ENGINE_VERSION: ${{ matrix.engine.version }}
        run: |
          set -euo pipefail
          fixture_name="kontainer-engine-${ENGINE_VERSION//./-}"
          socket_directory="$RUNNER_TEMP/$fixture_name"
          mkdir -p "$socket_directory"
          docker pull "$ENGINE_IMAGE"
          docker run --detach --privileged \
            --name "$fixture_name" \
            --env DOCKER_TLS_CERTDIR= \
            --volume "$socket_directory:/run/kontainer" \
            "$ENGINE_IMAGE" \
            --host=unix:///run/kontainer/docker.sock \
            --storage-driver=vfs \
            --iptables=false \
            --bridge=none

          ready=false
          for _ in $(seq 1 60); do
            if docker exec "$fixture_name" \
              docker --host unix:///run/kontainer/docker.sock info >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            docker logs "$fixture_name"
            exit 1
          fi

          sudo chmod 0666 "$socket_directory/docker.sock"
          echo "KONTAINER_FIXTURE_NAME=$fixture_name" >> "$GITHUB_ENV"
          echo "KONTAINER_TEST_DOCKER_SOCKET=$socket_directory/docker.sock" >> "$GITHUB_ENV"

      - name: Seed inventory
        run: |
          set -euo pipefail
          daemon=(docker --host unix:///run/kontainer/docker.sock)
          docker exec "$KONTAINER_FIXTURE_NAME" "${daemon[@]}" pull alpine:3.20
          echo "workload_image_digest=$(docker exec "$KONTAINER_FIXTURE_NAME" "${daemon[@]}" image inspect --format '{{index .RepoDigests 0}}' alpine:3.20)"
          docker exec "$KONTAINER_FIXTURE_NAME" "${daemon[@]}" run --detach \
            --name kontainer-inventory-running --network none alpine:3.20 sleep infinity
          docker exec "$KONTAINER_FIXTURE_NAME" "${daemon[@]}" run \
            --name kontainer-inventory-exited --network none alpine:3.20 true
          docker exec "$KONTAINER_FIXTURE_NAME" "${daemon[@]}" ps -a

      - name: Engine contracts
        env:
          KONTAINER_TEST_ENGINE_IMAGE: ${{ matrix.engine.image }}
          KONTAINER_TEST_ENGINE_VERSION: ${{ matrix.engine.version }}
          KONTAINER_TEST_ENGINE_API_VERSION: ${{ matrix.engine.negotiated_api }}
          EVIDENCE_FILE: docker-${{ matrix.engine.version }}.log
        run: |
          set -euo pipefail
          {
            echo "commit=$GITHUB_SHA"
            echo "runner_architecture=$(uname -m)"
            echo "rust_version=$(rustc --version)"
            echo "fixture_image=$KONTAINER_TEST_ENGINE_IMAGE"
            echo "fixture_digest=$(docker image inspect --format '{{index .RepoDigests 0}}' "$KONTAINER_TEST_ENGINE_IMAGE")"
            docker exec "$KONTAINER_FIXTURE_NAME" \
              docker --host unix:///run/kontainer/docker.sock version
            docker exec "$KONTAINER_FIXTURE_NAME" \
              docker --host unix:///run/kontainer/docker.sock ps -a
            for test_name in qualifies_configured_real_engine qualifies_paged_container_inventory; do
              echo "command=cargo test --manifest-path server/Cargo.toml --locked --package kontainer-engine --features real-engine-tests --test real_docker $test_name -- --exact --nocapture"
              output="$(cargo test --manifest-path server/Cargo.toml --locked \
                --package kontainer-engine --features real-engine-tests \
                --test real_docker "$test_name" -- --exact --nocapture 2>&1)" \
                || { echo "$output"; exit 1; }
              echo "$output"
              grep -q '^test result: ok\. 1 passed; 0 failed; 0 ignored;' <<<"$output"
            done
          } 2>&1 | tee "$EVIDENCE_FILE"
          grep -q 'KONTAINER_ENGINE_EVIDENCE' "$EVIDENCE_FILE"
          grep -q 'KONTAINER_CONTAINER_EVIDENCE' "$EVIDENCE_FILE"

      - name: Daemon shutdown
        env:
          KONTAINER_TEST_ENGINE_IMAGE: ${{ matrix.engine.image }}
          KONTAINER_TEST_ENGINE_VERSION: ${{ matrix.engine.version }}
          EVIDENCE_FILE: docker-${{ matrix.engine.version }}.log
        run: |
          set -euo pipefail
          docker stop "$KONTAINER_FIXTURE_NAME"
          {
            echo "daemon_shutdown_fixture=$KONTAINER_FIXTURE_NAME"
            echo "command=cargo test --manifest-path server/Cargo.toml --locked --package kontainer-engine --features real-engine-tests --test real_docker stopped_real_engine_maps_to_connection_unavailable -- --exact --nocapture"
            output="$(cargo test --manifest-path server/Cargo.toml --locked \
              --package kontainer-engine \
              --features real-engine-tests \
              --test real_docker \
              stopped_real_engine_maps_to_connection_unavailable \
              -- --exact --nocapture 2>&1)" \
              || { echo "$output"; exit 1; }
            echo "$output"
            grep -q '^test result: ok\. 1 passed; 0 failed; 0 ignored;' <<<"$output"
          } 2>&1 | tee -a "$EVIDENCE_FILE"

      - name: Docker evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-${{ matrix.engine.version }}
          path: docker-${{ matrix.engine.version }}.log
          if-no-files-found: error

      - name: Docker logs
        if: failure()
        run: docker logs "$KONTAINER_FIXTURE_NAME" || true

      - name: Stop Docker
        if: always()
        run: docker rm --force "$KONTAINER_FIXTURE_NAME" || true

  fake-engine:
    name: API fixture
    if: github.event_name == 'workflow_dispatch' && inputs.backend == 'fake'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
          shared-key: docker-fake
          cache-workspace-crates: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Docker API contracts
        run: |
          echo "::notice::Using the existing Docker API fixtures; real Docker and Swarm qualification is not covered."
          cargo test --manifest-path server/Cargo.toml --locked --package kontainer-engine --lib

name: Build and Push Agent Docker Image

on:
  push:
    branches:
      - main
    paths:
      - "agent/**"
      - ".github/workflows/build-agent.yml"
  pull_request:
    branches:
      - main
    paths:
      - "agent/**"
      - ".github/workflows/build-agent.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to tag (e.g. v0.2.0). Leave empty to auto-increment."
        required: false
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: prvious/kontainer-agent

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine version
        id: version
        if: github.event_name != 'pull_request'
        run: |
          set -e

          fetch_versions() {
            # Fetch existing tags from GHCR via GitHub API
            RESPONSE=$(curl -s -w "\n%{http_code}" \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/orgs/prvious/packages/container/kontainer-agent/versions?per_page=100")

            HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
            BODY=$(echo "$RESPONSE" | sed '$d')

            if [ "$HTTP_CODE" = "404" ] || [ "$HTTP_CODE" = "401" ]; then
              echo ""
              return
            fi

            echo "$BODY" \
              | jq -r '.[].metadata.container.tags[]' 2>/dev/null \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
              | sort -V || echo ""
          }

          increment_version() {
            local ver="${1#v}"
            local major minor patch
            IFS='.' read -r major minor patch <<< "$ver"
            patch=$((patch + 1))
            echo "v${major}.${minor}.${patch}"
          }

          EXISTING_VERSIONS=$(fetch_versions)

          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"

            # Validate format
            if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Version must be in format vX.Y.Z (e.g. v0.2.0)"
              exit 1
            fi

            # Check for collision
            if echo "$EXISTING_VERSIONS" | grep -qx "$VERSION"; then
              echo "::error::Version $VERSION already exists in the registry"
              exit 1
            fi

            echo "Using manually specified version: $VERSION"
          else
            if [ -z "$EXISTING_VERSIONS" ]; then
              VERSION="v0.1.0"
              echo "No existing versions found. Starting at $VERSION"
            else
              LATEST=$(echo "$EXISTING_VERSIONS" | tail -n1)
              VERSION=$(increment_version "$LATEST")
              echo "Latest version: $LATEST → next: $VERSION"
            fi
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Final version: $VERSION"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ github.event_name != 'pull_request' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: ./agent
          file: ./agent/Dockerfile
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: false
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        if: github.event_name == 'pull_request'
        run: |
          IMAGE_TAG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-$(echo ${{ github.sha }} | cut -c1-7)"
          echo "Smoke testing: $IMAGE_TAG"

          # Verify the binary exists and is executable
          docker run --rm --entrypoint /bin/sh "$IMAGE_TAG" -c "test -x /app/agent && echo 'Binary OK'"

          # Start the agent briefly and confirm it begins listening
          docker run --rm -d --name smoke-test -e PORT=9999 "$IMAGE_TAG"
          sleep 2
          STATUS=$(docker inspect --format='{{.State.Running}}' smoke-test 2>/dev/null || echo "false")
          docker rm -f smoke-test > /dev/null 2>&1

          if [ "$STATUS" = "true" ]; then
            echo "Smoke test passed — agent started successfully"
          else
            echo "::error::Agent container exited unexpectedly"
            exit 1
          fi

      - name: Push image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: ./agent
          file: ./agent/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "## Docker Image Build :white_check_mark:" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Build succeeded (not pushed — PR only)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Docker Image Published :rocket:" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**Version:** \`${{ steps.version.outputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"
            echo "**Image:** \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}\`" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo '```bash' >> "$GITHUB_STEP_SUMMARY"
            echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

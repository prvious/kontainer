name: Desktop e2e

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "server/crates/native-client/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/desktop-e2e.yml"
  pull_request:
    branches:
      - main
    paths:
      - "app/**"
      - "server/crates/native-client/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/desktop-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  smoke:
    # macOS only for now: the embedded WebDriver needs no extra driver or display there (ADR 0044).
    name: Desktop e2e (macos-latest)
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0

      # A separate cache key: the e2e build has different features than the verification lanes.
      - name: Cache Cargo build data
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
          key: e2e

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.8.1

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the e2e app
        run: pnpm --filter app e2e:build

      # The app reads its (empty) e2e vault entry at startup; a locked keychain would prompt.
      - name: Unlock the login keychain
        run: security unlock-keychain -p "" "$HOME/Library/Keychains/login.keychain-db"

      - name: Run the e2e suite
        run: pnpm --filter app e2e

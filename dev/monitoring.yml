services:
  dashboard:
    image: traefik/whoami
    deploy:
      replicas: 1
      labels:
        - devoper.enable=true
        - devoper.http.routers.monitoring-dashboard.rule=Host(`monitoring.test`)
        - devoper.http.services.monitoring-dashboard.loadbalancer.server.port=80
        - prvious.ssl=true
    networks:
      - devoper

  collector:
    image: traefik/whoami
    deploy:
      mode: global
    networks:
      - devoper

networks:
  devoper:
    driver: overlay
    attachable: true

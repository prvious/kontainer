services:
  dashboard:
    image: traefik/whoami
    deploy:
      replicas: 1
      labels:
        - kontainer.enable=true
        - kontainer.http.routers.monitoring-dashboard.rule=Host(`monitoring.test`)
        - kontainer.http.services.monitoring-dashboard.loadbalancer.server.port=80
        - prvious.ssl=true
      resources:
        limits:
          cpus: "0.25"
          memory: 64M
        reservations:
          cpus: "0.10"
          memory: 32M
    networks:
      - kontainer

  collector:
    image: traefik/whoami
    volumes:
      - collector-cache:/cache
    deploy:
      mode: global
      resources:
        limits:
          cpus: "0.15"
          memory: 48M
        reservations:
          cpus: "0.05"
          memory: 16M
    networks:
      - kontainer

volumes:
  collector-cache:

networks:
  kontainer:
    driver: overlay
    attachable: true

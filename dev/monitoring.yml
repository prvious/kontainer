services:
  dashboard:
    image: traefik/whoami
    deploy:
      replicas: 1
      labels:
        - devoper.enable=true
        - devoper.http.routers.monitoring-dashboard.rule=Host(`monitoring.test`)
        - devoper.http.services.monitoring-dashboard.loadbalancer.server.port=80
        - prvious.ssl=true
      resources:
        limits:
          cpus: "0.25"
          memory: 64M
        reservations:
          cpus: "0.10"
          memory: 32M
    networks:
      - devoper

  collector:
    image: traefik/whoami
    deploy:
      mode: global
      resources:
        limits:
          cpus: "0.15"
          memory: 48M
        reservations:
          cpus: "0.05"
          memory: 16M
    networks:
      - devoper

networks:
  devoper:
    driver: overlay
    attachable: true

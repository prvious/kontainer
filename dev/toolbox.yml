services:
  nginx:
    image: nginx:alpine
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "0.25"
          memory: 64M
        reservations:
          cpus: "0.10"
          memory: 32M
    networks:
      - devoper

  alpine:
    image: alpine:latest
    command: sleep infinity
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "0.15"
          memory: 32M
        reservations:
          cpus: "0.05"
          memory: 16M
    networks:
      - devoper

  redis:
    image: redis:alpine
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "0.25"
          memory: 64M
        reservations:
          cpus: "0.10"
          memory: 32M
    networks:
      - devoper

networks:
  devoper:
    driver: overlay
    attachable: true

name: devoper-cluster

services:
  manager:
    image: docker:dind
    privileged: true
    hostname: manager
    environment:
      DOCKER_TLS_CERTDIR: ""
    ports:
      - "2375:2375"
    networks:
      - dind
    volumes:
      - manager-data:/var/lib/docker
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
        reservations:
          cpus: "0.5"
          memory: 512M

  worker-1:
    image: docker:dind
    privileged: true
    hostname: worker-1
    environment:
      DOCKER_TLS_CERTDIR: ""
    ports:
      - "2376:2375"
    networks:
      - dind
    volumes:
      - worker1-data:/var/lib/docker
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
        reservations:
          cpus: "1.0"
          memory: 1024M

  worker-2:
    image: docker:dind
    privileged: true
    hostname: worker-2
    environment:
      DOCKER_TLS_CERTDIR: ""
    ports:
      - "2378:2375"
    networks:
      - dind
    volumes:
      - worker2-data:/var/lib/docker
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
        reservations:
          cpus: "0.5"
          memory: 512M

networks:
  dind:
    driver: bridge

volumes:
  manager-data:
  worker1-data:
  worker2-data:

name: kontainer-cluster

services:
  manager:
    image: docker:dind
    privileged: true
    hostname: manager
    environment:
      DOCKER_TLS_CERTDIR: ""
    ports:
      - "127.0.0.1:2375:2375"
    networks:
      dind:
        ipv4_address: 172.29.0.10
    volumes:
      - manager-data:/var/lib/docker
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
        reservations:
          cpus: "0.5"
          memory: 512M

  worker-1:
    image: docker:dind
    privileged: true
    hostname: worker-1
    environment:
      DOCKER_TLS_CERTDIR: ""
    ports:
      - "127.0.0.1:2376:2375"
    networks:
      dind:
        ipv4_address: 172.29.0.11
    volumes:
      - worker1-data:/var/lib/docker
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
        reservations:
          cpus: "1.0"
          memory: 1024M

  worker-2:
    image: docker:dind
    privileged: true
    hostname: worker-2
    environment:
      DOCKER_TLS_CERTDIR: ""
    ports:
      - "127.0.0.1:2378:2375"
    networks:
      dind:
        ipv4_address: 172.29.0.12
    volumes:
      - worker2-data:/var/lib/docker
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
        reservations:
          cpus: "0.5"
          memory: 512M

# Fixed addresses: the Swarm stores the manager's advertise address, and a
# restart that reshuffles bridge IPs would otherwise strand the workers.
networks:
  dind:
    driver: bridge
    ipam:
      config:
        - subnet: 172.29.0.0/24

volumes:
  manager-data:
  worker1-data:
  worker2-data:

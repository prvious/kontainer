services:
  web:
    image: traefik/whoami
    deploy:
      replicas: 3
      labels:
        - traefik.enable=true
        - traefik.http.routers.webapp-web.rule=Host(`webapp.test`)
        - traefik.http.services.webapp-web.loadbalancer.server.port=80
        - prvious.ssl=true
      resources:
        limits:
          cpus: "0.25"
          memory: 64M
        reservations:
          cpus: "0.10"
          memory: 32M
    networks:
      - kontainer

  api:
    image: traefik/whoami
    deploy:
      replicas: 2
      labels:
        - traefik.enable=true
        - traefik.http.routers.webapp-api.rule=Host(`api.webapp.test`)
        - traefik.http.services.webapp-api.loadbalancer.server.port=80
        - prvious.ssl=true
      resources:
        limits:
          cpus: "0.50"
          memory: 128M
        reservations:
          cpus: "0.25"
          memory: 64M
    networks:
      - kontainer

  worker:
    image: traefik/whoami
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "0.25"
          memory: 64M
        reservations:
          cpus: "0.10"
          memory: 32M
    networks:
      - kontainer

networks:
  kontainer:
    driver: overlay
    attachable: true

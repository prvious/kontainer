<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>devoper</title>
        <style>
            @import url("https://fonts.googleapis.com/css2?family=Figtree:wght@600&display=swap");

            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                background: #0a0a0a;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                height: 100vh;
                overflow: hidden;
                font-family:
                    "Figtree",
                    system-ui,
                    -apple-system,
                    sans-serif;
                -webkit-user-select: none;
                user-select: none;
            }

            .containers {
                display: flex;
                flex-direction: column;
                gap: 6px;
                margin-bottom: 18px;
            }

            .container-box {
                width: 48px;
                height: 14px;
                border-radius: 3px;
                opacity: 0;
                transform: translateY(20px);
                animation: slideUp 0.35s ease-out forwards;
            }

            .container-box:nth-child(1) {
                background: #6366f1;
                width: 52px;
                animation-delay: 0.1s;
            }
            .container-box:nth-child(2) {
                background: #818cf8;
                width: 44px;
                animation-delay: 0.25s;
            }
            .container-box:nth-child(3) {
                background: #a5b4fc;
                width: 36px;
                animation-delay: 0.4s;
            }

            @keyframes slideUp {
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }

            .wordmark {
                font-size: 28px;
                font-weight: 600;
                color: #f5f5f5;
                letter-spacing: -0.5px;
                opacity: 0;
                animation: fadeIn 0.5s ease-out 0.6s forwards;
            }

            @keyframes fadeIn {
                to {
                    opacity: 1;
                }
            }

            .dots {
                display: flex;
                gap: 6px;
                margin-top: 16px;
                opacity: 0;
                animation: fadeIn 0.3s ease-out 0.8s forwards;
            }

            .dot {
                width: 5px;
                height: 5px;
                border-radius: 50%;
                background: #6366f1;
                animation: pulse 1.2s ease-in-out infinite;
            }

            .dot:nth-child(2) {
                animation-delay: 0.2s;
            }
            .dot:nth-child(3) {
                animation-delay: 0.4s;
            }

            @keyframes pulse {
                0%,
                100% {
                    opacity: 0.3;
                    transform: scale(0.8);
                }
                50% {
                    opacity: 1;
                    transform: scale(1);
                }
            }

            .fade-out {
                animation: fadeOut 0.3s ease-out forwards;
            }

            @keyframes fadeOut {
                to {
                    opacity: 0;
                }
            }
        </style>
    </head>
    <body>
        <div class="containers">
            <div class="container-box"></div>
            <div class="container-box"></div>
            <div class="container-box"></div>
        </div>
        <div class="wordmark">devoper</div>
        <div class="dots">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
    </body>
</html>

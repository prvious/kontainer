[package]
name = "kontainer-desktop"
version = "0.1.0"
description = "Kontainer desktop"
authors = ["Clovis Muneza"]
edition = "2021"
rust-version = "1.98"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "kontainer_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-window-state = "2.4.1"
tokio-tungstenite = { version = "0.28.0", features = ["connect"] }
# Desktop session custody: the UI-neutral controller client, the OS credential
# vault, and the async/concurrency primitives the custody layer needs.
kontainer-native-client = { path = "../../server/crates/native-client" }
keyring-core = "1.0.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "test-util", "time"] }
tokio-util = "0.7"
uuid = { version = "1", features = ["serde", "v4"] }
zeroize = "1"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = { version = "1", features = ["crypto-rust"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1"

